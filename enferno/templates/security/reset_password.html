{% extends 'login-layout.html' %}

{% block content %}
<v-main class="d-flex flex-column align-center justify-center" style="min-height: 100vh; background: rgb(var(--v-theme-background));">
    <v-card class="mx-auto pa-8 w-100" rounded="lg" style="max-width: 424px;">
        <div class="text-center mb-6">
            <img src="/static/img/enferno.svg" alt="Logo" height="40" class="mb-4 logo-adaptive">
            <div class="text-headline-small font-weight-bold">Set a new password</div>
        </div>

        <form action="{{ url_for_security('reset_password', token=reset_password_token) }}" method="POST" name="reset_password_form">
            {{ reset_password_form.hidden_tag() }}
            <v-text-field name="password" type="password" label="New password" autocomplete="new-password" required
                          {% if reset_password_form.errors.password %}error-messages="{{ reset_password_form.errors.password[0] }}"{% endif %}
                          class="mb-2"></v-text-field>
            <v-text-field name="password_confirm" type="password" label="Confirm new password" autocomplete="new-password" required
                          {% if reset_password_form.errors.password_confirm %}error-messages="{{ reset_password_form.errors.password_confirm[0] }}"{% endif %}
                          class="mb-2"></v-text-field>

            {% include "security/_messages.html" %}

            <v-btn type="submit" color="primary" size="large" block>Set password</v-btn>
        </form>
    </v-card>
</v-main>
{% endblock %}

{% block js %}
<script>
    const app = Vue.createApp({ delimiters });
    app.use(Vuetify.createVuetify(vuetifyConfig)).mount('#app');
</script>
{% endblock %}
