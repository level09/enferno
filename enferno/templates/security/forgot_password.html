{% extends 'login-layout.html' %}

{% block content %}
<v-main class="d-flex flex-column align-center justify-center" style="min-height: 100vh; background: rgb(var(--v-theme-background));">
    <v-card class="mx-auto pa-8 w-100" rounded="lg" style="max-width: 424px;">
        <div class="text-center mb-6">
            <img src="/static/img/enferno.svg" alt="Logo" height="40" class="mb-4 logo-adaptive">
            <div class="text-headline-small font-weight-bold">Reset your password</div>
            <div class="text-body-medium text-medium-emphasis">We'll email you a link to set a new one</div>
        </div>

        <form action="{{ url_for_security('forgot_password') }}" method="POST" name="forgot_password_form">
            {{ forgot_password_form.hidden_tag() }}
            <v-text-field name="email" type="email" label="Email" autocomplete="email" required
                          {% if forgot_password_form.errors.email %}error-messages="{{ forgot_password_form.errors.email[0] }}"{% endif %}
                          class="mb-2"></v-text-field>

            {% include "security/_messages.html" %}

            <v-btn type="submit" color="primary" size="large" block>Send reset link</v-btn>
        </form>
    </v-card>

    <div class="mt-6 w-100 text-center" style="max-width: 424px;">
        <a href="{{ url_for_security('login') }}">Back to log in</a>
    </div>
</v-main>
{% endblock %}

{% block js %}
<script>
    const app = Vue.createApp({ delimiters });
    app.use(Vuetify.createVuetify(vuetifyConfig)).mount('#app');
</script>
{% endblock %}
