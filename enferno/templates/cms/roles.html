{% extends 'layout.html' %}
{% block css %}
{% endblock %}
{% block sidebar %}
{% endblock %}
{% block layout_classes %} align-center {% endblock %}
{% block content %}

    <v-card class="ma-2 mt-12 w-100 h-100">
        <v-toolbar>
            <v-toolbar-title>Roles Dashboard</v-toolbar-title>
            <v-spacer></v-spacer>
        </v-toolbar>
        <v-card-text>

            <v-data-table-server
                :headers="headers"
                :items="items"
                :items-length="itemsLength"
                :items-per-page="options.itemsPerPage"
                :loading="loading"
                :search="search"
                @update:options="refresh"
                hover
            >
                <template v-slot:top>
                    <v-toolbar color="transparent" class="mb-4 ga-4" density="compact" elevation="0">
                        <v-text-field v-model="search" placeholder="Search roles" prepend-inner-icon="ti-search"
                                      density="compact" variant="outlined" hide-details clearable max-width="320"></v-text-field>
                        <v-btn class="ml-auto" @click="createItem" size="small" variant="elevated" color="primary">
                            <template v-slot:prepend><i class="ti ti-plus"></i></template>
                            Add Role
                        </v-btn>
                    </v-toolbar>
                </template>
                <template v-slot:loading>
                    <v-skeleton-loader type="table-row@5"></v-skeleton-loader>
                </template>

                <template v-slot:item.actions="{ item }">
                    <v-btn icon="ti-pencil" variant="text" size="small" aria-label="Edit role" @click="editItem(item)"></v-btn>
                    <v-btn icon="ti-trash" variant="text" size="small" aria-label="Delete role" @click="deleteItem(item, item.name)"></v-btn>
                </template>

            </v-data-table-server>

        </v-card-text>
    </v-card>

    <!--Edit Dialog-->
    <v-dialog v-model="edialog" width="660">
        <v-card v-if="edialog" class="pa-6">
            <v-sheet class="d-flex justify-end">
                <v-btn @click="edialog=false" size="small" icon="ti ti-x" aria-label="Close" variant="text"></v-btn>
            </v-sheet>
            <v-card-title>${eitem.id ? 'Edit Role' : 'Add Role'}</v-card-title>

            <v-card-text>
                <v-text-field label="Name" v-model="eitem.name"></v-text-field>
                <v-textarea label="Description" v-model="eitem.description" rows="3"></v-textarea>
            </v-card-text>

            <v-card-actions>
                <v-spacer></v-spacer>
                <v-btn :loading="saving" color="primary" variant="elevated" @click="saveItem">Save</v-btn>
            </v-card-actions>
        </v-card>

    </v-dialog>

{% endblock %} {% block js %}

    <script>
        const {createApp} = Vue;
        const {createVuetify} = Vuetify;

        const vuetify = createVuetify(config.vuetifyConfig);

        window.app = createApp({
            mixins: [layoutMixin, crudMixin({list: '/api/roles', item: '/api/role/'})],
            delimiters: config.delimiters,
            data() {
                return {
                    headers: [
                        {title: 'ID', key: 'id'},
                        {title: 'Name', key: 'name'},
                        {title: 'Description', key: 'description', sortable: false},
                        {title: 'Actions', key: 'actions', sortable: false}
                    ]
                };
            }
        });

        registerEnfernoComponents(app);
        app.use(vuetify).mount("#app");
    </script>
{% endblock %}
