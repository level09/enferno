{% extends 'layout.html' %}
{% block css %}
{% endblock %}
{% block sidebar %}
{% endblock %}
{% block layout_classes %} align-center {% endblock %}
{% block content %}

    <v-card class="ma-2 mt-12 w-100 h-100">
        <v-toolbar>
            <v-toolbar-title>Activity Logs</v-toolbar-title>
            <v-spacer></v-spacer>
        </v-toolbar>
        <v-card-text>

            <v-data-table-server
                :headers="headers"
                :items="items"
                :items-length="itemsLength"
                :items-per-page="options.itemsPerPage"
                :loading="loading"
                :search="search"
                @update:options="refresh"
                hover
            >
                <template v-slot:top>
                    <v-toolbar color="transparent" class="mb-4" density="compact" elevation="0">
                        <v-text-field v-model="search" placeholder="Search actions" prepend-inner-icon="ti-search"
                                      density="compact" variant="outlined" hide-details clearable max-width="320"></v-text-field>
                    </v-toolbar>
                </template>
                <template v-slot:loading>
                    <v-skeleton-loader type="table-row@5"></v-skeleton-loader>
                </template>
                <template v-slot:item.data="{ item }">
                    <v-btn size="small" variant="text" color="primary" @click="showData(item)">
                        View Data
                    </v-btn>
                </template>
            </v-data-table-server>

        </v-card-text>
    </v-card>

    <!-- Data Dialog -->
    <v-dialog v-model="dataDialog" width="800">
        <v-card v-if="dataDialog" class="pa-4">
            <v-card-title class="d-flex align-center">
                ${current.action}
                <v-spacer></v-spacer>
                <v-btn icon="ti ti-x" aria-label="Close" size="small" variant="text" @click="dataDialog = false"></v-btn>
            </v-card-title>

            <v-card-text>
                <!-- Updates store {old, new}: show only the fields that changed -->
                <!-- In-DOM templates: table rows must sit in a <template>, or the
                     browser's HTML parser moves them out of <v-table> -->
                <v-table v-if="changes" density="compact">
                    <template v-slot:default>
                        <thead>
                            <tr><th>Field</th><th>Before</th><th>After</th></tr>
                        </thead>
                        <tbody>
                            <tr v-for="change in changes" :key="change.field">
                                <td>${change.field}</td>
                                <td class="text-error">${change.old}</td>
                                <td class="text-success">${change.new}</td>
                            </tr>
                            <tr v-if="!changes.length"><td colspan="3">No fields changed.</td></tr>
                        </tbody>
                    </template>
                </v-table>
                <pre v-else class="pa-4 rounded bg-grey-lighten-4"><code>${JSON.stringify(current.data, null, 2)}</code></pre>
            </v-card-text>
        </v-card>
    </v-dialog>

{% endblock %} {% block js %}

    <script>
        const {createApp} = Vue;
        const {createVuetify} = Vuetify;

        const vuetify = createVuetify(config.vuetifyConfig);
        const show = value => typeof value === 'object' && value !== null ? JSON.stringify(value) : String(value ?? '');

        window.app = createApp({
            mixins: [layoutMixin, crudMixin({list: '/api/activities'})],
            delimiters: config.delimiters,
            data() {
                return {
                    dataDialog: false,
                    current: null,
                    headers: [
                        {title: 'ID', key: 'id', sortable: false},
                        {title: 'User', key: 'user', sortable: false},
                        {title: 'Action', key: 'action'},
                        {title: 'Date', key: 'created_at'},
                        {title: 'Data', key: 'data', sortable: false}
                    ]
                };
            },
            computed: {
                changes() {
                    const data = this.current?.data;
                    if (!data || !data.old || !data.new) return null;
                    const fields = new Set([...Object.keys(data.old), ...Object.keys(data.new)]);
                    return [...fields]
                        .map(field => ({field, old: show(data.old[field]), new: show(data.new[field])}))
                        .filter(change => change.old !== change.new);
                }
            },
            methods: {
                showData(item) {
                    this.current = item;
                    this.dataDialog = true;
                }
            }
        });

        registerEnfernoComponents(app);
        app.use(vuetify).mount("#app");
    </script>
{% endblock %}
